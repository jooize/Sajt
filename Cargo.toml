[workspace]
resolver = "3"
members = ["crates/core", "crates/serve", "crates/build"]

[workspace.package]
version = "0.32.0"
edition = "2024"

# One version of every dependency for the whole workspace, so crates/build and
# crates/push (staticdrop.md) can never drift from what crates/serve links.
[workspace.dependencies]
staticdrop-core = { path = "crates/core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["set-header", "trace", "catch-panic"] }
chrono = "0.4"
xattr = "1"
plist = "1"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
scraper = "0.22"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
directories = "6"
sha2 = "0.10"
unicode-normalization = "0.1"
img-parts = "0.4"
kamadak-exif = "0.6"
libc = "0.2"
lopdf = { version = "0.44.0", default-features = false }
imagesize = "0.15"
quick-xml = "0.41"
base64 = "0.22.1"
