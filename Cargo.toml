[package]
name = "sajt"
version = "0.37.0"
edition = "2024"
# Minimum supported toolchain. rust-toolchain.toml pins the exact version
# every build uses; this is the floor crates.io advertises.
rust-version = "1.93"
description = "Publishing engine where the filesystem is the CMS: drop a file in a folder, tag it public, it is published."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jooize/Sajt"
readme = "README.md"
keywords = ["static-site", "publishing", "cms", "markdown", "asciidoc"]
categories = ["web-programming", "command-line-utilities", "text-processing"]
# crates.io is permanent: a version can be yanked, never deleted. Publishing
# stays gated off until the engine is de-branded, the repository is public,
# and a first release is cut on purpose. Flip to true when release.yml is
# meant to ship for real; until then that workflow fails fast at publish.
publish = false

# One package, two targets. The library (src/lib.rs) is the engine: the
# content tree as a pure function, rendering, the privacy gates, page
# generation, and the author-side fetches. The binary (src/main.rs) is the
# `sajt` command, whose `serve` and `build` subcommands are thin skins over
# the same library, so the preview server and the static closure cannot
# disagree about a single byte.

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["set-header", "trace", "catch-panic"] }
chrono = "0.4"
xattr = "1"
plist = "1"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
scraper = "0.22"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
directories = "6"
# `sajt grade trash` moves the ledger to the system Trash (Finder Trash on
# macOS, the freedesktop trash on Linux): removable, never deleted outright.
trash = "5"
sha2 = "0.10"
unicode-normalization = "0.1"
# Image metadata stripping (post-model.md section 8): container-level surgery
# that drops EXIF/XMP/IPTC/comment segments while keeping pixels byte-exact
# and the ICC profile. `kamadak-exif` reads the orientation tag robustly
# (untrusted input, so a parser that never panics) before we drop the EXIF
# that carried it.
img-parts = "0.4"
kamadak-exif = "0.6"
# Set RLIMIT_CPU on the libvips transcode subprocess (a pre-exec backstop
# against a runaway decode of an attacker-controlled image, on top of the
# wall-clock timeout). Unix only; the code is `#[cfg(unix)]`-gated.
libc = "0.2"
lopdf = { version = "0.44.0", default-features = false }
# Pre-decode dimensions gate (decompression-bomb defense): a pure-Rust header
# parse for every raster format we transcode, so an image declaring absurd
# dimensions is withheld before libvips ever decodes it.
imagesize = "0.15"
quick-xml = "0.41"
base64 = "0.22.1"
