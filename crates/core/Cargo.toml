[package]
name = "staticdrop-core"
version.workspace = true
edition.workspace = true

# Everything that is a pure function of the content tree plus rendering, and the
# author-side network fetches (embed/outbound run at build/refresh time). No web
# framework: axum types never appear here, so crates/build links the exact same
# pipeline as crates/serve and static output cannot diverge from preview.
[dependencies]
tokio.workspace = true
chrono.workspace = true
xattr.workspace = true
plist.workspace = true
mime_guess.workspace = true
tracing.workspace = true
reqwest.workspace = true
ammonia.workspace = true
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
scraper.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
# Image metadata stripping (post-model.md §8): container-level surgery that drops
# EXIF/XMP/IPTC/comment segments while keeping pixels byte-exact and the ICC
# profile. `kamadak-exif` reads the orientation tag robustly (untrusted input, so
# a parser that never panics) before we drop the EXIF that carried it.
img-parts.workspace = true
kamadak-exif.workspace = true
# Set RLIMIT_CPU on the libvips transcode subprocess (a pre-exec backstop against
# a runaway decode of an attacker-controlled image, on top of the wall-clock
# timeout). Unix only; the code is `#[cfg(unix)]`-gated.
libc.workspace = true
lopdf.workspace = true
# Pre-decode dimensions gate (decompression-bomb defense): a pure-Rust header
# parse for every raster format we transcode, so an image declaring absurd
# dimensions is withheld before libvips ever decodes it.
imagesize.workspace = true
quick-xml.workspace = true
base64.workspace = true
