[package]
name = "sajt-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sajt closure builder: renders a whole site to a manifest and blob store, with host adapters and a verifier"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# The closure builder (sajt.md): walk the transitive closure of the
# site's own link graph through sajt-core's page layer, write every
# reply to a content-addressed blob store, and emit the host-neutral manifest
# plus a build report. Also home to the manifest renderings (the Caddyfile
# adapter) and the verifier that replays the manifest against a live host
# (reqwest is for that verifier only; the build walk itself never touches
# the network beyond core's embed refresh).
[dependencies]
reqwest.workspace = true
sajt-core.workspace = true
tokio.workspace = true
clap.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
