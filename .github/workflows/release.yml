# Release: publish the workspace to crates.io from CI with trusted publishing.
#
# No long-lived secret anywhere. The job asks GitHub for a short-lived OIDC
# identity token, exchanges it at crates.io for a temporary registry token
# (rust-lang/crates-io-auth-action), publishes with it, and the action
# revokes that token when the job ends. Provenance for the packaged crates
# is then attested with actions/attest-build-provenance, so anyone can
# verify that a given .crate was built by this workflow at this commit.
#
# Bootstrap, once and by hand: crates.io can only be told to trust a
# workflow for a crate that already exists, so the first version of each
# crate is published from a workstation with a personal API token. After
# that, in each crate's crates.io settings, add a Trusted Publisher with
# owner jooize, repository Sajt, workflow release.yml, environment release.
# Create the matching "release" environment under the repository's
# Settings > Environments; adding a required reviewer there puts a human
# gate in front of every publish.
#
# Until [workspace.package].publish is flipped to true this workflow fails
# fast at the publish step, and that is the point: nothing ships by accident.
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges for a temporary registry token
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Tag must name the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(nix develop --command cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match the workspace version $version" >&2
            exit 1
          fi

      - name: Test
        run: nix develop --command cargo test --workspace --locked

      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # cargo packages every crate, verifies each one builds from its own
      # .crate, and uploads them in dependency order (core before the
      # binaries). The .crate files it leaves in target/package are the
      # exact bytes crates.io received, so they are what gets attested.
      - name: Publish
        run: nix develop --command cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Attest build provenance of the published crates
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate
