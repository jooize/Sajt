<!doctype html>
<html lang="en" data-glass="rows">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>esko.bar — Timeline · glass flair</title>
<style>
/* ================================================================
   GLASS FLAIR EXPLORATION over the timeline.
   Same functionality and placements as timeline-mockup.html — the
   only addition is a bottom control (and the `g` key) that layers
   glass carried over from entries-site.html, in steps:
     plain — reference, exactly the shipped plain design
     wall  — faint tinted wall behind the page; controls and the
             help dialog pick up glass material
     rows  — plus every entry row floats as a glass card
     full  — plus the tag-cloud header sits on its own glass mat
   The glass layer lives at the very end of this stylesheet; nothing
   above it was touched. Original notes follow.
   ================================================================
   Timeline design reference, v4.8.
   The tag cloud IS the header — no site nav at all (the timeline
   is the site root; a "Timeline" link on the timeline is noise).
   The cloud block sits left but wraps into centered lines within
   its own width — cloudy, not left-leaning. Clicking a topic
   filters the timeline in place; the selected topic wears a quiet
   Finder-grey pill drawn as an absolute ::after (out of flow, so
   nothing shifts a pixel on toggle, and its capsule ends are true
   semicircles; Esc or a second click clears).
   Below: the saved-bookmarks count (a × between the mark and the
   number) hangs in the left margin (x-aligned with the entries'
   bookmark marks); the level control
   is a stepped-bars icon (lit to the current level, explained on
   hover) plus a segmented control — everything/notable/best —
   with ★ favorites as an independent toggle that composes with
   the level; search is always visible on its own line, its field
   width-matched to the segmented control (measured live) so it sits
   centered under the choices, never past their edges. In the saved
   view, filters that hide bookmarked entries are called out by
   name with a one-click "show them". A row's hover zone extends
   into the margin its marks hang in.
   Month headings are sentence case, slightly larger, bold.
   The full shape comparison lives in filter-control-mockup.html.
   Rows unchanged from v3: uniform titles, hairline quality meter
   with threshold ticks, hanging ★/bookmark, vertical tags — except
   the bookmark is now a dim-always outline that brightens only by
   pointer proximity, in two stages: within ~50px it lifts to full but
   stays grey, and landing on the icon turns it violet — never on plain
   row hover. Nothing appears or vanishes, and it stays discoverable in
   compact mode too. A reading-width edge grip drives --content-w and
   shares the entry page's mock-width store, so a width set on
   either page is the site's width on both.
   Keyboard: ? shows all shortcuts.
   ================================================================ */

:root {
  color-scheme: light dark;

  --violet: #a123f6;
  --violet-soft: light-dark(rgba(161, 35, 246, .08), rgba(161, 35, 246, .13));

  --bg:     light-dark(#f5f4f0, #121514);
  --ink:    light-dark(#20231f, #d9ded9);
  --soft:   light-dark(#43473f, #b4bab2);
  --faint:  light-dark(#71766c, #8b918a);
  --hair:   light-dark(rgba(46, 62, 50, .18), rgba(178, 205, 184, .16));
  --pill:   light-dark(rgba(46, 62, 50, .1), rgba(178, 205, 184, .14));

  /* Finder tag colors, tuned per scheme */
  --tag-red:    light-dark(#e0383e, #ff6961);
  --tag-orange: light-dark(#e8842c, #ffb340);
  --tag-yellow: light-dark(#d9a800, #ffd426);
  --tag-green:  light-dark(#2f9e50, #30db5b);
  --tag-blue:   light-dark(#1673de, #409cff);
  --tag-purple: light-dark(#9853d2, #bf5af2);
  --tag-gray:   light-dark(#8e8e93, #98989d);

  --sans:  system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --content-w: 46rem;
  --rail: 5.6rem;
}

* { margin: 0; box-sizing: border-box; }

body {
  background: #f5f4f0;
  background: var(--bg);
  color: #20231f;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
  padding-inline: 1.25rem;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--violet);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection { background: rgba(161, 35, 246, .25); }

a { color: #8318c9; color: var(--violet); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

main {
  max-width: var(--content-w);
  margin-inline: auto;
  padding: 1.4rem 0 4rem;
}

/* ---------- reading-width handle ----------
   the same edge grip as the entry page, driving the same --content-w.
   Both pages read and write one stored width (mock-width), so a width
   set on either is the site's width everywhere. Hidden once the window
   is too narrow to resize (the timeline is full-width there anyway). */
#grip {
  position: fixed;
  top: 50%;
  translate: 0 -50%;
  left: calc(50% + var(--content-w) / 2 + .55rem);
  width: 1.1rem;
  height: 3.8rem;
  display: grid;
  place-items: center;
  cursor: col-resize;
  touch-action: none;
  border-radius: 999px;
  z-index: 5;
}
#grip::before {
  content: "";
  width: 4px;
  height: 2.4rem;
  border-radius: 999px;
  background: var(--hair);
  transition: background .15s ease, height .15s ease;
}
#grip:hover::before,
#grip:focus-visible::before,
#grip.active::before { background: var(--violet); height: 3.1rem; }

@media (prefers-reduced-motion: reduce) { #grip::before { transition: none; } }
@media (max-width: 56rem) { #grip { display: none; } }

/* live readout: the current reading width in px, rem and characters-per-line.
   Shown only while dragging (.active) or while the grip holds keyboard focus
   (tab, then Left/Right). Pinned to the viewport's right edge — always fully
   on-screen, and at wide widths the grip meets it there. */
#readout {
  position: fixed;
  top: 50%;
  left: 0;                 /* JS positions it just right of the dragger */
  translate: 0 -50%;
  display: grid;
  grid-template-columns: auto auto;
  column-gap: .32rem;
  align-items: baseline;
  text-align: right;       /* values share a right-aligned column ... */
  font: 500 .72rem/1.4 var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
  color: var(--bg);
  background: var(--ink);
  padding: .36rem .52rem;
  border-radius: .4rem;
  opacity: 0;
  pointer-events: none;
  z-index: 6;
  transition: opacity .12s ease;
}
#readout b { font-weight: 600; }
#readout i { font-style: normal; text-align: left; opacity: .55; }  /* ... units flush left */
body:has(#grip.active) #readout,
body:has(#grip:focus-visible) #readout { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #readout { transition: none; } }
@media (max-width: 56rem) { #readout { display: none; } }

/* no text selection while a drag is in progress */
body:has(#grip.active) { -webkit-user-select: none; user-select: none; }

/* ---------- the cloud is the header ----------
   size = entries, ink = recency, dot = Finder color.
   Click filters the timeline right here. */

#cloud {
  position: relative;
  /* narrow enough to wrap into a few lines; the block sits left but
     the lines stay centered within it — cloudy, not left-leaning */
  max-width: 30rem;
  margin-inline: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  column-gap: 1.4rem;
  row-gap: .5rem;
  padding: 1rem .5rem 2.6rem;
  line-height: 1.25;
}

#cloud a {
  display: inline-flex;
  align-items: baseline;
  gap: .38rem;
  font-weight: 550;
  letter-spacing: -.011em;
}
#cloud a:hover { color: var(--violet) !important; text-decoration: none; }
/* the selected topic wears a quiet Finder-grey pill; text, dot, and
   count keep their colors. The pill is an absolutely positioned
   ::after — out of flow, so nothing can shift by even a pixel on
   toggle, and the radius rounds the pill's own box, so its ends are
   true semicircles (box-shadow spread flattened them) */
#cloud a { position: relative; }
#cloud a[aria-current="true"] { isolation: isolate; }
#cloud a[aria-current="true"]::after {
  content: "";
  position: absolute;
  /* a pixel down: text sits high in its line box, so the centered
     capsule looked lifted off the label */
  inset: calc(-.14em + 1px) -.6em calc(-.14em - 1px);
  z-index: -1;
  border-radius: 999px;
  background: var(--pill);
}
#cloud a::before {
  content: "";
  align-self: center;
  /* optically a touch low, so the dot sits on the label's midline */
  translate: 0 .09em;
  width: .5em;
  height: .5em;
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--tag, var(--tag-gray));
}
#cloud a > small {
  font-size: .68em;
  font-weight: 500;
  color: var(--faint);
  font-feature-settings: "tnum";
  /* optically a touch above the baseline — visual only, so nothing
     shifts when the pill toggles */
  translate: 0 -.07em;
}


/* ---------- controls: one quiet line, no rule ---------- */

main > form {
  position: relative;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .4rem 1.2rem;
  font: 550 .8rem var(--sans);
  color: var(--faint);
}

/* saved bookmarks: hangs in the left margin, x-aligned with the
   entries' bookmark marks (article edge -.6rem, mark -2.8rem) */
#navsaved {
  position: absolute;
  left: -3.4rem;
  /* centered on the segmented control's line (search sits below) */
  top: .95rem;
  translate: 0 -50%;
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  padding: 0 .1rem;
  color: var(--faint);
}
#navsaved:hover { color: var(--violet); text-decoration: none; }
#navsaved[aria-current="page"] { color: var(--violet); }
#navsaved svg {
  width: .85rem;
  height: .85rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linejoin: round;
}
#navsaved[aria-current="page"] svg { fill: currentColor; }
#navsaved output {
  font: 500 .74rem var(--mono);
  font-feature-settings: "tnum";
}
/* a quiet × between the mark and the number: "N of them", not a control */
#navsaved i {
  font-style: normal;
  font-size: .72rem;
  opacity: .5;
}
#navsaved[hidden] { display: none; }

main > form p {
  display: inline-flex;
  gap: .55rem;
  align-items: center;
}
/* the stepped bars: a staircase of solid bars, lit to the level */
main > form p > svg {
  width: 1.1rem;
  height: 1.1rem;
  fill: currentColor;
}
main > form p > svg rect { opacity: .3; }
main > form p > svg rect[data-on] { opacity: 1; }

main > form p button {
  padding: 0;
  border: none;
  background: none;
  color: var(--faint);
  font: inherit;
  cursor: pointer;
}
main > form p button > b { color: var(--violet); font-weight: 500; }
main > form p button:hover { color: var(--violet); }
main > form p button[aria-pressed="true"] {
  color: var(--ink);
  box-shadow: 0 2px 0 -.5px var(--violet);
}

/* segmented control: a sliding thumb in a quiet capsule */
main > form p > span {
  position: relative;
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: 2px;
  border-radius: 999px;
  background: light-dark(rgba(46, 62, 50, .07), rgba(178, 205, 184, .09));
}
main > form p > span > u {
  position: absolute;
  inset-block: 2px;
  left: 2px;
  width: calc((100% - 4px) / 3);
  border-radius: 999px;
  background: light-dark(#fff, rgba(178, 205, 184, .14));
  box-shadow: 0 1px 3px light-dark(rgba(20, 24, 20, .16), rgba(0, 0, 0, .4));
  transition: left .18s ease;
}
main > form p > span > button {
  position: relative;
  padding: .3em .9em;
  border-radius: 999px;
}
main > form p > span > button[aria-pressed="true"] {
  color: var(--ink);
  box-shadow: none;
}

/* search: always visible. The magnifier shares the bars' 1.1rem box
   and the same .55rem gap, so the field's left edge lands exactly
   under where the segmented choices begin. */
main > form search {
  flex-basis: 100%;
  margin: .4rem 0 0;
  display: inline-flex;
  align-items: center;
  gap: .55rem;
}
main > form search button {
  display: inline-flex;
  padding: 0;
  border: none;
  background: none;
  color: var(--faint);
  cursor: pointer;
}
main > form search button:hover { color: var(--violet); }
main > form search button svg {
  width: 1.1rem;
  height: 1.1rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
}
main > form search input {
  width: 11rem;
  padding: .2rem 0;
  border: none;
  border-bottom: 1px solid var(--hair);
  border-radius: 0;
  background: none;
  color: var(--ink);
  font: .85rem var(--sans);
}
main > form search input::placeholder { color: var(--faint); }
main > form search input:focus {
  outline: none;
  border-bottom-color: var(--violet);
}

/* ---------- month headings: sentence case, a touch larger, bold */

main section > h2 {
  margin: 2.3rem 0 .7rem;
  font: 650 .95rem var(--sans);
  font-feature-settings: "tnum";
  letter-spacing: -.011em;
  color: var(--soft);
}

main section > ul { list-style: none; margin: 0; padding: 0; }

/* ---------- rows ---------- */

main article {
  position: relative;
  display: grid;
  grid-template-columns: var(--rail) 1fr;
  column-gap: 1.25rem;
  padding: .75rem .6rem;
  margin-inline: -.6rem;
  border-radius: 10px;
}
main article.selected { background: var(--violet-soft); }

/* the row's hover reaches into the margin its marks hang in, so the
   bookmark appears when the pointer is anywhere that belongs to the
   entry — including the empty spot where a star would be */
main article::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -3.4rem;
  width: 3.4rem;
}

/* --- left rail: date, quality meter, tags — one straight scan line */

main article > aside {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
main article > aside > time {
  font: 500 .74rem var(--mono);
  /* same 1.5rem line box as the title, so their baselines agree */
  line-height: 1.5rem;
  font-feature-settings: "tnum";
  letter-spacing: .02em;
  color: var(--faint);
  white-space: nowrap;
}

/* quality: a hairline meter — gradual fill, ticks at the
   notable/best thresholds the view control also uses */
main article > aside > span {
  position: relative;
  width: 2.9rem;
  height: 2px;
  margin-top: .55rem;
  border-radius: 1px;
  background: var(--hair);
}
main article > aside > span > i {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 1px;
  background: var(--faint);
}
main article:hover > aside > span > i,
main article.selected > aside > span > i { background: var(--violet); }
main article > aside > span::before,
main article > aside > span::after {
  content: "";
  position: absolute;
  top: -2px;
  width: 1px;
  height: 6px;
  background: var(--hair);
}
main article > aside > span::before { left: 50%; }
main article > aside > span::after { left: 78%; }

/* tags: vertical, in their Finder colors */
main article > aside > nav {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: .18rem;
  margin-top: .6rem;
}
main article > aside > nav a {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font: 550 .74rem var(--sans);
  color: var(--soft);
}
main article > aside > nav a:hover { color: var(--violet); text-decoration: none; }
main article > aside > nav a::before {
  content: "";
  width: .42rem;
  height: .42rem;
  border-radius: 50%;
  background: var(--tag, var(--tag-gray));
}

/* --- hanging marks, like footnotes: ★ nearest, bookmark outside it.
       Positioned against the article (aside is not positioned), on the
       title line. They live in the rail markup so narrow screens can
       reflow them inline. */

main article aside > b {
  position: absolute;
  top: .75rem;
  left: -1.4rem;
  color: var(--violet);
  font-size: .8rem;
  font-weight: 500;
  line-height: 1.5rem;
}
main article aside > button {
  position: absolute;
  top: .75rem;
  left: -2.8rem;
  display: inline-flex;
  align-items: center;
  height: 1.5rem;
  padding: 0 .1rem;
  border: none;
  background: none;
  color: var(--faint);
  cursor: pointer;
  /* the outline is always faintly there — nothing appears or vanishes.
     It does NOT react to plain row hover. Two stages by nearness: within
     ~50px the pointer lifts it to full opacity but still grey (the .near
     class, set in JS); landing directly on the icon turns it violet. Full
     also on real focus and once saved. In compact mode there is no hover
     margin, so a resting outline is the only way it's discoverable. */
  opacity: .32;
  transition: opacity .15s ease, color .15s ease;
}
main article aside > button.near,
main article aside > button:focus-visible,
main article aside > button[aria-pressed="true"] { opacity: 1; }
main article aside > button:hover { color: var(--violet); }
main article aside > button[aria-pressed="true"] { color: var(--violet); }
main article aside > button svg {
  width: .85rem;
  height: .85rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linejoin: round;
}
main article aside > button[aria-pressed="true"] svg { fill: currentColor; }
@media (prefers-reduced-motion: reduce) {
  main article aside > button,
  main > form p > span > u { transition: none; }
}

/* --- content: every title the same size ---------------------- */

main article h3 {
  font-size: 1rem;
  font-weight: 650;
  letter-spacing: -.011em;
  line-height: 1.5;
}
main article h3 a { color: var(--ink); }
main article h3 a:hover { color: var(--violet); text-decoration: none; }
main article h3 small {
  /* extension / folder slash: same size, slightly greyed */
  font-size: 1em;
  font-weight: inherit;
  color: var(--soft);
}
main article h3 i { font-weight: 450; color: var(--faint); }

main article > div > p {
  margin-top: .1rem;
  font-size: .875rem;
  color: var(--soft);
}

/* imagery: placeholder gradients here; real thumbnails on the site */
main article figure {
  margin-top: .6rem;
  max-width: 24rem;
  aspect-ratio: 5 / 1.9;
  border-radius: 10px;
  border: 1px solid var(--hair);
}

#mount > p {
  padding: 3rem 0;
  text-align: center;
  font-size: .875rem;
  color: var(--soft);
}
/* the "hidden by filters" note names the entries and offers the way out */
#mount > p small { color: var(--soft); }
#mount > p button {
  padding: 0;
  border: none;
  background: none;
  color: var(--violet);
  font: inherit;
  cursor: pointer;
}
#mount > p button:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- help dialog (?) ---------- */

dialog {
  min-width: min(21rem, calc(100vw - 3rem));
  /* opens just above its trigger, the "? shortcuts" footer line */
  margin: auto auto 4.4rem;
  border: 1px solid var(--hair);
  border-radius: 14px;
  padding: 1.3rem 1.5rem 1.4rem;
  background: var(--bg);
  color: var(--ink);
  box-shadow: 0 12px 32px light-dark(rgba(20, 24, 20, .14), rgba(0, 0, 0, .5));
}
dialog::backdrop { background: rgba(10, 12, 11, .3); }
dialog h2 {
  font-size: .95rem;
  font-weight: 650;
  margin-bottom: .8rem;
}
dialog dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: .4rem 1rem;
  font-size: .85rem;
  color: var(--soft);
}
dialog dt { text-align: right; }
dialog p {
  margin-top: 1rem;
  padding-top: .8rem;
  border-top: 1px solid var(--hair);
  font-size: .8rem;
  color: var(--soft);
}
dialog p b { color: var(--violet); font-weight: 500; }

kbd { font: 500 .95em var(--mono); }

/* ---------- mockup footer: just the door to the help ---------- */

body > footer {
  max-width: var(--content-w);
  margin-inline: auto;
  padding-bottom: 3rem;
  font: .8rem var(--sans);
  color: var(--soft);
  text-align: center;
}
body > footer button {
  padding: 0;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
body > footer button:hover { color: var(--violet); }
body > footer fieldset {
  display: inline-flex;
  gap: .1rem;
  margin: 0 1rem 0 0;
  padding: 2px;
  border: 1px solid var(--hair);
  border-radius: 999px;
}
body > footer label {
  position: relative;
  padding: .16rem .6rem;
  border-radius: 999px;
  font-weight: 550;
  cursor: pointer;
  user-select: none;
}
body > footer label:has(:checked) { color: var(--ink); background: var(--pill); }
body > footer label input {
  position: absolute;
  inset: 0;
  opacity: 0;
  margin: 0;
  cursor: pointer;
}

@media (max-width: 56rem) {
  /* no margin to hang into: marks flow inline after the date,
     and the saved count leads the control line */
  main article aside > b,
  main article aside > button { position: static; height: auto; }
  main article::before { content: none; }
  main article { grid-template-columns: 1fr; row-gap: .15rem; }
  main article > aside {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    column-gap: .6rem;
  }
  main article > aside > span { margin-top: 0; }
  main article > aside > nav { flex-direction: row; margin-top: 0; column-gap: .6rem; }
  #navsaved { position: static; translate: none; }
  #cloud { column-gap: 1.2rem; }
}

/* ================================================================
   GLASS FLAIR — everything below is the exploration layer.
   Tokens carried over from entries-site.html, re-tuned to this
   palette (warm paper light, green-tinged dark). Gradient stops
   always fade to the same color at 0 alpha, never `transparent`,
   and the tints stay low to dodge 8-bit banding on dark.
   ================================================================ */

html {
  --glass:        light-dark(rgba(255, 255, 255, .5),  rgba(44, 50, 46, .44));
  --glass-strong: light-dark(rgba(252, 252, 250, .68), rgba(40, 46, 42, .64));
  --glass-edge:   light-dark(rgba(255, 255, 255, .62), rgba(255, 255, 255, .1));
  --glass-shadow:
    0 6px 20px light-dark(rgba(30, 34, 28, .09), rgba(0, 0, 0, .38)),
    0 1px 2px  light-dark(rgba(30, 34, 28, .06), rgba(0, 0, 0, .3)),
    inset 0 1px 0 light-dark(rgba(255, 255, 255, .7), rgba(255, 255, 255, .12));
  --glass-shadow-hover:
    0 12px 28px light-dark(rgba(30, 34, 28, .14), rgba(0, 0, 0, .48)),
    0 1px 2px   light-dark(rgba(30, 34, 28, .06), rgba(0, 0, 0, .3)),
    inset 0 1px 0 light-dark(rgba(255, 255, 255, .8), rgba(255, 255, 255, .16));
}

/* wall and up: a faint tinted wall behind the page — the violet
   leads, blue and green whisper from the edges */
html:not([data-glass="plain"]) body {
  background:
    radial-gradient(52rem 36rem at 14% -8%,
      light-dark(rgba(161, 35, 246, .13), rgba(161, 35, 246, .18)),
      rgba(161, 35, 246, 0) 60%),
    radial-gradient(46rem 34rem at 102% 12%,
      light-dark(rgba(38, 168, 237, .1), rgba(38, 168, 237, .12)),
      rgba(38, 168, 237, 0) 60%),
    radial-gradient(58rem 42rem at 55% 115%,
      light-dark(rgba(52, 199, 89, .1), rgba(52, 199, 89, .1)),
      rgba(52, 199, 89, 0) 62%),
    var(--bg);
  background-attachment: fixed;
}

/* wall and up: the chrome picks up glass material — segmented capsule
   and help dialog. Shapes and placement identical. */
html:not([data-glass="plain"]) main > form p > span {
  background: var(--glass);
  border: .5px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  box-shadow: inset 0 1px 0 light-dark(rgba(255, 255, 255, .55), rgba(255, 255, 255, .08));
}
html:not([data-glass="plain"]) dialog {
  background: var(--glass-strong);
  border-color: var(--glass-edge);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
  backdrop-filter: blur(26px) saturate(180%);
}
html:not([data-glass="plain"]) dialog::backdrop {
  background: rgba(10, 12, 11, .25);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
}

/* rows and up: every entry row floats as a glass card. The card is
   the article's existing box — same padding, same grid, same hanging
   marks in the margin — only the material and a little air between
   rows change. */
html:is([data-glass="rows"], [data-glass="full"]) main section > ul {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
html:is([data-glass="rows"], [data-glass="full"]) main article {
  background: var(--glass);
  border: .5px solid var(--glass-edge);
  border-radius: 14px;
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);
  box-shadow: var(--glass-shadow);
  transition: transform .16s ease, box-shadow .16s ease;
}
html:is([data-glass="rows"], [data-glass="full"]) main article:hover {
  transform: translateY(-1px);
  box-shadow: var(--glass-shadow-hover);
}
html:is([data-glass="rows"], [data-glass="full"]) main article.selected {
  background: color-mix(in srgb, var(--violet) 9%, var(--glass));
}
html:is([data-glass="rows"], [data-glass="full"]) main article figure {
  border-color: var(--glass-edge);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
}
@media (prefers-reduced-motion: reduce) {
  html:is([data-glass="rows"], [data-glass="full"]) main article { transition: none; }
  html:is([data-glass="rows"], [data-glass="full"]) main article:hover { transform: none; }
}

/* full: the tag-cloud header sits on its own glass mat */
html[data-glass="full"] #cloud {
  background: var(--glass);
  border: .5px solid var(--glass-edge);
  border-radius: 18px;
  -webkit-backdrop-filter: blur(20px) saturate(170%);
  backdrop-filter: blur(20px) saturate(170%);
  box-shadow: var(--glass-shadow);
  padding: 1.4rem 1.2rem 1.6rem;
  margin-block: .6rem 1.6rem;
}
</style>
</head>
<body>

<div id="grip" role="slider" tabindex="0" aria-label="Reading width"
     aria-orientation="horizontal" aria-valuemin="480" aria-valuemax="1160"
     aria-valuenow="736" title="Drag to set reading width. Double-click resets."></div>
<div id="readout" aria-hidden="true"></div>

<main>
  <!-- the cloud is the header; built from the entries below -->
  <nav id="cloud" aria-label="Topics"></nav>

  <form>
    <a href="#saved" id="navsaved" hidden aria-label="Saved for later">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11V21l-5.5-4-5.5 4z"/></svg>
      <i aria-hidden="true">&times;</i>
      <output>0</output>
    </a>
    <p aria-label="How much to show">
      <svg viewBox="0 0 24 24"><title>Showing everything</title><rect x="2" y="14" width="5.5" height="8" rx="2.4"/><rect x="9.25" y="8" width="5.5" height="14" rx="2.4"/><rect x="16.5" y="2" width="5.5" height="20" rx="2.4"/></svg>
      <span>
        <u></u>
        <button type="button" data-level="0" aria-pressed="true">everything</button>
        <button type="button" data-level="1" aria-pressed="false">notable</button>
        <button type="button" data-level="2" aria-pressed="false">best</button>
      </span>
      <button type="button" id="favonly" aria-pressed="false"><b>★</b> favorites</button>
    </p>
    <search>
      <button type="button" id="qbtn" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M15.2 15.2 21.5 21.5"/></svg>
      </button>
      <input type="search" id="q" placeholder="Search" aria-label="Search entries">
    </search>
  </form>

  <div id="mount"></div>
</main>

<footer>
  <fieldset aria-label="Glass flair (mockup control)">
    <label><input type="radio" name="glass" value="plain">Plain</label>
    <label><input type="radio" name="glass" value="wall">Wall</label>
    <label><input type="radio" name="glass" value="rows" checked>Rows</label>
    <label><input type="radio" name="glass" value="full">Full</label>
  </fieldset>
  <button type="button" id="helpbtn"><kbd>?</kbd> shortcuts</button>
</footer>

<dialog id="help" aria-label="Keyboard shortcuts">
  <h2>Keyboard</h2>
  <dl>
    <dt><kbd>j</kbd> / <kbd>k</kbd></dt><dd>select next / previous</dd>
    <dt><kbd>Enter</kbd></dt><dd>open the selected entry</dd>
    <dt><kbd>b</kbd></dt><dd>save for later</dd>
    <dt><kbd>/</kbd></dt><dd>search</dd>
    <dt><kbd>g</kbd></dt><dd>cycle glass flair (mockup)</dd>
    <dt><kbd>Esc</kbd></dt><dd>clear, close</dd>
    <dt><kbd>?</kbd></dt><dd>this help</dd>
  </dl>
  <p><b>★</b> marks my favorites. Bookmarks are yours — they never leave
  this browser.</p>
</dialog>

<script>
(() => {
  /* Finder tag colors travel with the tags (read from the xattr). */
  const TAG = {
    design:   'var(--tag-purple)',
    travel:   'var(--tag-green)',
    dev:      'var(--tag-blue)',
    meme:     'var(--tag-orange)',
    writing:  'var(--tag-green)',
    personal: 'var(--tag-red)',
    meta:     'var(--tag-gray)',
    apps:     'var(--tag-blue)',
    audio:    'var(--tag-orange)',
    intro:    'var(--tag-gray)',
  };

  /* kind is the TYPE (from the file itself, not a tag): photo, note,
     page, link, folder. Search matches it, so typing "photo" filters.
     fav = my `favorite` Finder tag; art = placeholder imagery;
     q = pairwise grade, drawn as the rail meter */
  const E = [
    { kind:'note', label:'hello-world', ext:'.md', date:'2026-03-03', q:.82, tags:['intro'],
      sub:'This is the first post on esko.bar — what it is, why it exists, and how a folder became a website.' },
    { kind:'photo', label:'sunset', ext:'.jpg', date:'2026-03-03', q:.55, tags:[],
      sub:'Golden hour over the bay.',
      art:'linear-gradient(160deg,#f6b26b,#e06666 55%,#674ea7)' },
    { kind:'note', label:null, ext:'.txt', date:'2026-03-04', q:.20, tags:[],
      sub:'Just a plain text note.' },
    { kind:'note', label:'code-highlighting', ext:'.md', date:'2026-03-05', q:.70, tags:['dev'],
      sub:'Fenced code blocks in Rust, Python, Bash, JS — one palette in light and dark.' },
    { kind:'photo', label:'cat-loaf', ext:'.gif', date:'2026-03-09', q:.62, tags:['meme'],
      sub:'When the deploy finally goes green.',
      art:'linear-gradient(140deg,#b7b7b7,#8d7350 70%,#5b4a36)' },
    { kind:'page', label:'glass-tuner', ext:'.html', date:'2026-03-11', q:.90, fav:true, tags:['design','dev'],
      sub:'An interactive SVG specular-light tuner — drag the highlight around and watch the glass respond.' },
    { kind:'page', label:'rain-canvas', ext:'.html', date:'2026-03-14', q:.76, tags:['design'],
      sub:'Lightweight Canvas 2D rain renderer.' },
    { kind:'link', label:'things-3', ext:'.link', date:'2026-03-19', q:.35, tags:['apps'],
      sub:'apps.apple.com · App Store' },
    { kind:'link', label:'the-daily', ext:'.link', date:'2026-03-19', q:.40, tags:['audio'],
      sub:'podcasts.apple.com · Podcast' },
    { kind:'page', label:'snow-test', ext:'.html', date:'2026-04-02', q:.68, tags:['design'],
      sub:'Snowfall variant prototypes.' },
    { kind:'photo', label:'screenshot-bug', ext:'.png', date:'2026-04-18', q:.38, tags:['dev','meme'],
      sub:'It works on my machine.' },
    { kind:'note', label:'on-file-systems', ext:'.md', date:'2026-04-24', q:.88, fav:true, tags:['writing'],
      sub:'Why folders lost to tags: a file lives in one place, a thought never does.' },
    { kind:'note', label:'journal-2026-05', ext:'.md', date:'2026-05-02', q:.30, tags:['personal'],
      sub:'A personal post — tagged personal, still public.' },
    { kind:'folder', label:'open-source-licenses', ext:'/', date:'2026-05-18', q:.72, tags:['meta'],
      sub:'A folder as an entry — clean name, native date, assets addressable inside.' },
    { kind:'photo', label:'wireframe', ext:'.png', date:'2026-05-26', q:.45, tags:['design'],
      sub:'420 KB · 1600×1000' },
    { kind:'photo', label:'family-trip', ext:'.jpg', date:'2026-05-30', q:.84, tags:['travel'],
      sub:'Twelve photos from the coast — fog in the morning, unreasonable blue by noon.',
      art:'linear-gradient(150deg,#76a5af,#45818e 45%,#134f5c 80%,#0b5394)' },
  ];

  const MONTHS = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];
  const BOOKMARK = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M6.5 3.5h11V21l-5.5-4-5.5 4z"/></svg>';

  const store = window.localStorage;
  const saved = new Set(JSON.parse(store.getItem('mock-saved') || '[]'));
  const keyOf = e => e.label ?? e.date + e.ext;
  const tier = q => q >= .78 ? 3 : q >= .5 ? 2 : 1;
  const pct = q => Math.max(1, Math.round((1 - q) * 100));

  /* favorites is its own axis, so it composes with the level:
     "best" + ★ = my favorite best things */
  let level = 0, favOnly = false, query = '', view = 'all',
    activeTag = null, selected = -1;

  const mount = document.getElementById('mount');
  const cloud = document.getElementById('cloud');
  const navsaved = document.getElementById('navsaved');
  const count = navsaved.querySelector('output');
  const qInput = document.getElementById('q');
  const help = document.getElementById('help');

  const esc = s => s.replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const matches = e => {
    if (view === 'saved' && !saved.has(keyOf(e))) return false;
    if (tier(e.q) < level + 1) return false;
    if (favOnly && !e.fav) return false;
    if (activeTag && !e.tags.includes(activeTag)) return false;
    if (!query) return true;
    return [e.label ?? '', e.sub, e.kind, e.ext, ...e.tags]
      .join(' ').toLowerCase().includes(query);
  };

  const monthKey = e => {
    const [y, m] = e.date.split('-');
    return MONTHS[+m - 1] + ' ' + y;
  };

  /* ---------- the cloud: derived from the entries ---------- */

  function buildCloud() {
    const stats = new Map();
    E.forEach(e => e.tags.forEach(t => {
      const s = stats.get(t) ?? { n: 0, last: '' };
      s.n++;
      if (e.date > s.last) s.last = e.date;
      stats.set(t, s);
    }));
    const names = [...stats.keys()].sort();
    const maxN = Math.max(...[...stats.values()].map(s => s.n));
    const newest = [...stats.values()].map(s => s.last).sort().at(-1);
    /* ink = recency: fresh topics dark and bold, dormant ones fade */
    const ink = last => {
      const days = (Date.parse(newest) - Date.parse(last)) / 864e5;
      return days <= 14 ? 'color:var(--ink);font-weight:650'
           : days <= 60 ? 'color:var(--soft);font-weight:550'
           : 'color:var(--faint);font-weight:500';
    };
    const sizeOf = n =>
      (0.82 + (maxN > 1 ? (n - 1) / (maxN - 1) : 0) * 0.43).toFixed(2);
    cloud.innerHTML = names.map(t => {
      const s = stats.get(t);
      return `<a href="#/+${esc(t)}" data-tag="${esc(t)}"
        style="--tag:${TAG[t] ?? 'var(--tag-gray)'};font-size:${sizeOf(s.n)}rem;${ink(s.last)}"
        title="${s.n} ${s.n === 1 ? 'entry' : 'entries'}, last active ${s.last}">${
        esc(t)} <small>${s.n}</small></a>`;
    }).join('');
  }

  const row = (e, i) => `
    <li>
      <article data-i="${i}"${i === selected ? ' class="selected"' : ''}>
        <aside>
          <time datetime="${e.date}">${e.date}</time>
          ${e.fav ? '<b title="A favorite of mine">★</b>' : ''}
          <button type="button" aria-pressed="${saved.has(keyOf(e))}"
            aria-label="Save for later (stays in this browser)"
            title="Save for later — stays in this browser">${BOOKMARK}</button>
          <span title="Graded top ${pct(e.q)}%" aria-label="Graded top ${pct(e.q)}%">
            <i style="width:${Math.round(e.q * 100)}%"></i></span>
          <nav aria-label="Tags">${e.tags.map(t =>
            `<a href="#/+${esc(t)}" data-tag="${esc(t)}" style="--tag:${TAG[t] ?? 'var(--tag-gray)'}">${esc(t)}</a>`).join('')}
          </nav>
        </aside>
        <div>
          <h3><a href="#/${e.label ?? 'untitled'}">${e.label
            ? esc(e.label) + '<small>' + esc(e.ext) + '</small>'
            : '<i>(untitled)</i><small>' + esc(e.ext) + '</small>'}</a></h3>
          <p>${esc(e.sub)}</p>
          ${e.art ? `<figure style="background:${e.art}" role="img" aria-label="Preview of ${esc(e.label ?? 'image')}"></figure>` : ''}
        </div>
      </article>
    </li>`;

  /* in the saved view, filters can hide bookmarked entries — say so,
     name them, and offer the one-click way out */
  const filteredNote = hidden => {
    const links = hidden.map(e =>
      `<a href="#/${e.label ?? 'untitled'}">${e.label
        ? esc(e.label) : '(untitled)'}<small>${esc(e.ext)}</small></a>`).join(' · ');
    const lead = hidden.length === 1
      ? 'One saved entry is hidden by the current filters'
      : `${hidden.length} saved entries are hidden by the current filters`;
    return `<p>${lead}: ${links} —
      <button type="button" id="unhide">show them</button></p>`;
  };

  function paint() {
    const data = E.map((e, i) => [e, i]).filter(([e]) => matches(e))
      .sort(([a], [b]) => a.date < b.date ? 1 : -1);
    const hidden = view === 'saved'
      ? E.filter(e => saved.has(keyOf(e)) && !matches(e)) : [];
    if (!data.length) {
      mount.innerHTML = view === 'saved'
        ? (hidden.length ? filteredNote(hidden)
          : '<p>Nothing saved yet — the bookmark on any entry keeps it here, in this browser.</p>')
        : '<p>Nothing matches.</p>';
    } else {
      const groups = [];
      data.forEach(([e, i]) => {
        const k = monthKey(e);
        if (!groups.length || groups.at(-1)[0] !== k) groups.push([k, []]);
        groups.at(-1)[1].push([e, i]);
      });
      mount.innerHTML = groups.map(([m, items]) =>
        `<section><h2>${m}</h2><ul>${
          items.map(([e, i]) => row(e, i)).join('')}</ul></section>`).join('')
        + (hidden.length ? filteredNote(hidden) : '');
    }
    navsaved.hidden = saved.size === 0 && view !== 'saved';
    count.textContent = saved.size;
    navsaved.setAttribute('aria-current', view === 'saved' ? 'page' : 'false');
    cloud.querySelectorAll('a').forEach(a =>
      a.setAttribute('aria-current', a.dataset.tag === activeTag ? 'true' : 'false'));
  }

  /* ---------- controls ---------- */

  /* segmented control: thumb slides under the pick; the stepped
     bars beside it light up to match and explain themselves on hover */
  const thumb = document.querySelector('main > form p > span > u');
  const stairSvg = document.querySelector('main > form p > svg');
  const stair = [...stairSvg.querySelectorAll('rect')];
  const favbtn = document.getElementById('favonly');
  const LEVEL_TIP = [
    'Showing everything',
    'Showing notable and better — graded top 50%',
    'Showing only the best — graded top 22%',
  ];

  function applyControls() {
    document.querySelectorAll('[data-level]').forEach(x =>
      x.setAttribute('aria-pressed', +x.dataset.level === level));
    thumb.style.left = `calc(2px + ${level} * (100% - 4px) / 3)`;
    stair.forEach((r, i) => r.toggleAttribute('data-on', i <= level));
    stairSvg.querySelector('title').textContent = LEVEL_TIP[level];
    favbtn.setAttribute('aria-pressed', favOnly);
  }

  document.querySelectorAll('[data-level]').forEach(b =>
    b.addEventListener('click', () => {
      level = +b.dataset.level;
      applyControls();
      selected = -1;
      paint();
    }));

  favbtn.addEventListener('click', () => {
    favOnly = !favOnly;
    applyControls();
    selected = -1;
    paint();
  });
  applyControls();

  /* search field spans exactly the segmented control: its left edge
     already lands under "everything" (magnifier + gap === bars + gap),
     so matching the control's measured width lines the right edge up
     under "best" too — centered under the choices, never past them.
     Cleared in compact mode, where the control wraps and CSS takes over. */
  const segSpan = document.querySelector('main > form p > span');
  const compact = window.matchMedia('(max-width: 56rem)');
  function syncSearchWidth() {
    if (compact.matches) { qInput.style.width = ''; return; }
    qInput.style.width = segSpan.getBoundingClientRect().width + 'px';
  }
  syncSearchWidth();
  window.addEventListener('resize', syncSearchWidth);
  compact.addEventListener('change', syncSearchWidth);

  /* any topic — in the cloud or on a row — filters in place */
  document.addEventListener('click', ev => {
    const a = ev.target.closest('a[data-tag]');
    if (!a) return;
    ev.preventDefault();
    activeTag = activeTag === a.dataset.tag ? null : a.dataset.tag;
    selected = -1;
    paint();
  });

  document.getElementById('qbtn').addEventListener('click', () => qInput.focus());
  qInput.addEventListener('input', () => {
    query = qInput.value.trim().toLowerCase();
    selected = -1;
    paint();
  });

  navsaved.addEventListener('click', ev => {
    ev.preventDefault();
    view = view === 'saved' ? 'all' : 'saved';
    selected = -1;
    paint();
  });

  /* ---------- bookmarks (localStorage only — nothing leaves the browser) */

  mount.addEventListener('click', ev => {
    if (ev.target.closest('#unhide')) {
      /* drop every filter that can hide a saved entry */
      level = 0;
      favOnly = false;
      activeTag = null;
      query = '';
      qInput.value = '';
      applyControls();
      selected = -1;
      paint();
      return;
    }
    const btn = ev.target.closest('aside > button');
    if (!btn) return;
    const e = E[+btn.closest('article').dataset.i];
    saved.has(keyOf(e)) ? saved.delete(keyOf(e)) : saved.add(keyOf(e));
    store.setItem('mock-saved', JSON.stringify([...saved]));
    paint();
  });

  /* ---------- bookmark proximity glow ----------
     the mark rests dim and brightens by nearness, not by row hover:
     within ~50px of the button it gets .near — full opacity but still
     grey; landing directly on the icon (:hover) is what turns it violet.
     Distance is to the nearest point of the button's box, so the empty
     margin around it counts too. Throttled to one rAF per move. */

  const NEAR = 50;
  let nearRaf = 0, nearX = -1e4, nearY = -1e4;
  const updateNear = () => {
    nearRaf = 0;
    mount.querySelectorAll('article aside > button').forEach(btn => {
      const r = btn.getBoundingClientRect();
      const dx = Math.max(r.left - nearX, 0, nearX - r.right);
      const dy = Math.max(r.top - nearY, 0, nearY - r.bottom);
      btn.classList.toggle('near', dx * dx + dy * dy <= NEAR * NEAR);
    });
  };
  const queueNear = () => { if (!nearRaf) nearRaf = requestAnimationFrame(updateNear); };
  document.addEventListener('pointermove', ev => {
    if (ev.pointerType === 'touch') return;
    nearX = ev.clientX; nearY = ev.clientY;
    queueNear();
  });
  /* when the pointer leaves the window, let every mark settle back to dim */
  document.documentElement.addEventListener('pointerleave', () => {
    nearX = nearY = -1e4;
    queueNear();
  });

  /* ---------- glass flair (mockup-only control) ---------- */

  const glassInputs = [...document.querySelectorAll('input[name=glass]')];
  const GLASS = glassInputs.map(i => i.value);
  const setGlass = v => {
    if (!GLASS.includes(v)) v = 'rows';
    document.documentElement.dataset.glass = v;
    glassInputs.find(i => i.value === v).checked = true;
    store.setItem('mock-glass', v);
  };
  setGlass(store.getItem('mock-glass') || 'rows');
  glassInputs.forEach(i =>
    i.addEventListener('change', () => setGlass(i.value)));

  /* ---------- help ---------- */

  document.getElementById('helpbtn').addEventListener('click', () => help.showModal());
  help.addEventListener('click', ev => { if (ev.target === help) help.close(); });

  /* ---------- keyboard ---------- */

  const rows = () => [...mount.querySelectorAll('article')];

  function move(delta) {
    const r = rows();
    if (!r.length) return;
    const cur = r.findIndex(a => +a.dataset.i === selected);
    const next = Math.max(0, Math.min(r.length - 1, cur + delta));
    selected = +r[next].dataset.i;
    r.forEach(a => a.classList.toggle('selected', +a.dataset.i === selected));
    r[next].scrollIntoView({ block: 'nearest' });
  }

  document.addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.target === qInput) {
      if (ev.key === 'Escape') { qInput.value = ''; query = ''; qInput.blur(); paint(); }
      return;
    }
    if (ev.target.closest('input, textarea') || help.open) return;
    switch (ev.key) {
      case 'j': case 'ArrowDown': ev.preventDefault(); move(1); break;
      case 'k': case 'ArrowUp': ev.preventDefault(); move(-1); break;
      case 'Enter': {
        const a = mount.querySelector('article.selected h3 a');
        if (a) a.click();
        break;
      }
      case 'b': {
        const btn = mount.querySelector('article.selected aside > button');
        if (btn) btn.click();
        break;
      }
      case '/': ev.preventDefault(); qInput.focus(); break;
      case 'g':
        setGlass(GLASS[(GLASS.indexOf(document.documentElement.dataset.glass) + 1) % GLASS.length]);
        break;
      case '?': help.showModal(); break;
      case 'Escape':
        selected = -1;
        activeTag = null;
        if (query) { qInput.value = ''; query = ''; }
        paint();
        break;
    }
  });

  /* ---------- reading width: the same grip and store as the entry
     page, so a width set on either page is the site's width on both */

  const grip = document.getElementById('grip');
  const readout = document.getElementById('readout');
  const rootEl = document.documentElement;
  const mainEl = document.querySelector('main');
  const MINW = 480;
  const maxW = () => Math.min(1160, window.innerWidth - 64);
  const clampW = v => Math.max(MINW, Math.min(maxW(), v));
  let width = parseFloat(store.getItem('mock-width')) || null;

  /* advance width of one character ('0') in the reading font, so we can
     report characters-per-line — the metric that actually governs reading
     comfort. Constant across widths (font-size is fixed), measured once. */
  const remPx = parseFloat(getComputedStyle(rootEl).fontSize) || 16;
  let chPx = 0;
  const measureCh = () => {
    const probe = document.createElement('span');
    probe.textContent = '0'.repeat(50);
    probe.style.cssText =
      'position:absolute;visibility:hidden;white-space:pre;top:-9999px';
    const cs = getComputedStyle(mainEl);
    probe.style.font = cs.font || `${cs.fontSize} ${cs.fontFamily}`;
    document.body.appendChild(probe);
    chPx = probe.getBoundingClientRect().width / 50;
    probe.remove();
  };

  const applyWidth = () => {
    if (width) rootEl.style.setProperty('--content-w', clampW(width) + 'px');
    else rootEl.style.removeProperty('--content-w');
    const px = Math.round(mainEl.getBoundingClientRect().width);
    grip.setAttribute('aria-valuenow', px);
    grip.setAttribute('aria-valuemax', Math.round(maxW()));
    if (!chPx) measureCh();
    let cells = `<b>${px}</b><i>px</i><b>${(px / remPx).toFixed(1)}</b><i>rem</i>`;
    if (chPx) cells += `<b>${Math.round(px / chPx)}</b><i>ch</i>`;
    readout.innerHTML = cells;
    // ride the right side of the dragger; when it runs out of room, pin to the edge
    const gr = grip.getBoundingClientRect();
    const room = window.innerWidth - readout.offsetWidth - 10;
    readout.style.left = Math.max(6, Math.min(gr.right + 6, room)) + 'px';
    syncSearchWidth();
  };

  let dragging = false, grabDX = 0;
  grip.addEventListener('pointerdown', e => {
    dragging = true;
    grip.classList.add('active');
    grip.setPointerCapture(e.pointerId);
    // remember where on the grip you grabbed, relative to the content edge,
    // so the bar stays under the cursor instead of jumping to the edge
    grabDX = e.clientX - mainEl.getBoundingClientRect().right;
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return;
    const right = e.clientX - grabDX;
    width = clampW((right - window.innerWidth / 2) * 2);
    applyWidth();
  });
  grip.addEventListener('pointerup', () => {
    dragging = false;
    grip.classList.remove('active');
    if (width) store.setItem('mock-width', width);
  });
  grip.addEventListener('dblclick', () => {
    width = null;
    store.removeItem('mock-width');
    applyWidth();
  });
  grip.addEventListener('keydown', e => {
    const cur = mainEl.getBoundingClientRect().width;
    if (e.key === 'ArrowRight') width = clampW(cur + 24);
    else if (e.key === 'ArrowLeft') width = clampW(cur - 24);
    else if (e.key === 'Home') width = null;
    else return;
    e.preventDefault();
    if (width) store.setItem('mock-width', width);
    else store.removeItem('mock-width');
    applyWidth();
  });
  window.addEventListener('resize', applyWidth);
  applyWidth();

  buildCloud();
  paint();
})();
</script>
</body>
</html>
