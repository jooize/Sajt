<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>esko.bar — Timeline</title>
<style>
/* ================================================================
   Timeline design reference, v2 — graded density.
   Quality is shown as PROMINENCE, newspaper-style: the best entries
   are large with description and imagery, good ones are regular,
   the rest are compact single lines. No meters, no slider.
   All metadata lives on a left rail (date, author's star, reader's
   bookmark) so the eyes travel one straight line down.
   Tags carry their Finder colors. Bookmarks stay in this browser.
   Keyboard: j/k select, Enter open, b bookmark, / search, Esc clear.
   ================================================================ */

:root {
  color-scheme: light dark;

  --violet: #a123f6;
  --violet-soft: light-dark(rgba(161, 35, 246, .08), rgba(161, 35, 246, .13));

  --bg:     light-dark(#f5f4f0, #121514);
  --ink:    light-dark(#20231f, #d9ded9);
  --soft:   light-dark(#43473f, #b4bab2);
  --faint:  light-dark(#71766c, #8b918a);
  --hair:   light-dark(rgba(46, 62, 50, .18), rgba(178, 205, 184, .16));

  /* Finder tag colors, tuned per scheme */
  --tag-red:    light-dark(#e0383e, #ff6961);
  --tag-orange: light-dark(#e8842c, #ffb340);
  --tag-yellow: light-dark(#d9a800, #ffd426);
  --tag-green:  light-dark(#2f9e50, #30db5b);
  --tag-blue:   light-dark(#1673de, #409cff);
  --tag-purple: light-dark(#9853d2, #bf5af2);
  --tag-gray:   light-dark(#8e8e93, #98989d);

  --sans:  system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --content-w: 46rem;
  --rail: 5.2rem;
}

* { margin: 0; box-sizing: border-box; }

body {
  background: #f5f4f0;
  background: var(--bg);
  color: #20231f;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
  padding-inline: 1.25rem;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--violet);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection { background: rgba(161, 35, 246, .25); }

a { color: #8318c9; color: var(--violet); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- site nav ---------- */

body > header {
  max-width: var(--content-w);
  margin-inline: auto;
  padding: 1.15rem 0 .1rem;
}

body > header > nav {
  display: flex;
  flex-wrap: wrap;
  gap: 1.35rem;
  font: 550 .8rem var(--sans);
}

body > header > nav > a { color: var(--faint); }
body > header > nav > a:hover { color: var(--violet); text-decoration: none; }
body > header > nav > a[aria-current="page"] { color: var(--ink); }
body > header > nav > a[hidden] { display: none; }

/* ---------- controls: one quiet line ---------- */

main {
  max-width: var(--content-w);
  margin-inline: auto;
  padding: 1.7rem 0 4rem;
}

main > form {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: .4rem 1.2rem;
  padding-bottom: .9rem;
  border-bottom: 1px solid var(--hair);
  font: 550 .8rem var(--sans);
  color: var(--faint);
}

main > form p { display: inline-flex; gap: .55rem; align-items: baseline; }
main > form p button {
  padding: 0;
  border: none;
  background: none;
  color: var(--faint);
  font: inherit;
  cursor: pointer;
}
main > form p button:hover { color: var(--violet); }
main > form p button[aria-pressed="true"] {
  color: var(--ink);
  box-shadow: 0 2px 0 -.5px var(--violet);
}

main > form search { margin-left: auto; }
main > form search input {
  width: 9rem;
  padding: .2rem 0;
  border: none;
  border-bottom: 1px solid var(--hair);
  border-radius: 0;
  background: none;
  color: var(--ink);
  font: .85rem var(--sans);
}
main > form search input::placeholder { color: var(--faint); }
main > form search input:focus {
  outline: none;
  border-bottom-color: var(--violet);
}

/* ---------- month headings sit on the rail ---------- */

main > section > h2 {
  margin: 2rem 0 .6rem;
  font: 500 .74rem var(--mono);
  font-feature-settings: "tnum";
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--faint);
}

main > section > ul { list-style: none; padding: 0; }

/* ---------- rows: left rail carries ALL metadata ---------- */

main article {
  display: grid;
  grid-template-columns: var(--rail) 1fr;
  column-gap: 1.15rem;
  padding: .5rem .55rem;
  margin-inline: -.55rem;
  border-radius: 10px;
}
main article.selected { background: var(--violet-soft); }

main article > aside {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: .15rem;
  padding-top: .2rem;
}
main article > aside > time {
  font: 500 .74rem var(--mono);
  font-feature-settings: "tnum";
  letter-spacing: .06em;
  color: var(--faint);
  white-space: nowrap;
}
/* the author's star: a favorite of mine (the `favorite` Finder tag) */
main article > aside > b {
  color: var(--violet);
  font-size: .8rem;
  font-weight: 500;
  line-height: 1.3;
}
/* the reader's bookmark: saved in this browser only */
main article > aside > button {
  display: inline-flex;
  padding: .1rem .15rem 0 0;
  border: none;
  background: none;
  color: var(--faint);
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s ease;
}
main article:hover > aside > button,
main article.selected > aside > button,
main article > aside > button:focus-visible,
main article > aside > button[aria-pressed="true"] { opacity: 1; }
main article > aside > button:hover { color: var(--violet); }
main article > aside > button[aria-pressed="true"] { color: var(--violet); }
main article > aside > button svg {
  width: .85rem;
  height: .85rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linejoin: round;
}
main article > aside > button[aria-pressed="true"] svg { fill: currentColor; }
@media (hover: none) { main article > aside > button { opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  main article > aside > button { transition: none; }
}

main article h3 {
  font-weight: 650;
  letter-spacing: -.011em;
  line-height: 1.3;
}
main article h3 a { color: var(--ink); }
main article h3 a:hover { color: var(--violet); text-decoration: none; }
main article h3 small {
  font-size: .78em;
  font-weight: 450;
  color: var(--faint);
}
main article h3 i { font-weight: 450; color: var(--faint); }

main article > div > p {
  margin-top: .1rem;
  font-size: .875rem;
  color: var(--soft);
}

/* tags in their Finder colors: dot + name */
main article footer {
  display: flex;
  flex-wrap: wrap;
  gap: .15rem .9rem;
  margin-top: .3rem;
}
main article footer a {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font: 550 .74rem var(--sans);
  color: var(--soft);
}
main article footer a:hover { color: var(--violet); text-decoration: none; }
main article footer a::before {
  content: "";
  width: .45rem;
  height: .45rem;
  border-radius: 50%;
  background: var(--tag, var(--tag-gray));
}

/* imagery: placeholder gradients here; real thumbnails on the site */
main article figure {
  margin-top: .55rem;
  border-radius: 10px;
  border: 1px solid var(--hair);
}

/* ----- graded density: quality is prominence, not a meter ----- */

/* tier 3 — the best: large, described, pictured */
main article[data-tier="3"] { margin-block: .35rem; }
main article[data-tier="3"] h3 { font-size: 1.22rem; font-weight: 700; }
main article[data-tier="3"] > div > p { font-size: .92rem; margin-top: .15rem; }
main article[data-tier="3"] figure { aspect-ratio: 5 / 2.4; }

/* tier 2 — good: regular */
main article[data-tier="2"] h3 { font-size: 1rem; }
main article[data-tier="2"] figure {
  aspect-ratio: 5 / 1.6;
  max-width: 24rem;
}

/* tier 1 — the rest: one compact line */
main article[data-tier="1"] { padding-block: .3rem; }
main article[data-tier="1"] h3 { font-size: .89rem; font-weight: 550; }
main article[data-tier="1"] h3 a { color: var(--soft); }
main article[data-tier="1"] h3 a:hover { color: var(--violet); }
main article[data-tier="1"] > div > p,
main article[data-tier="1"] figure,
main article[data-tier="1"] footer { display: none; }

main > p {
  padding: 3rem 0;
  text-align: center;
  font-size: .875rem;
  color: var(--soft);
}

/* ---------- mockup hints, bottom ---------- */

body > footer {
  max-width: var(--content-w);
  margin-inline: auto;
  padding-bottom: 3rem;
  font: .8rem var(--sans);
  color: var(--soft);
  text-align: center;
}

kbd { font: 500 .95em var(--mono); }

@media (max-width: 40rem) {
  :root { --rail: 3.6rem; }
  main > form search { margin-left: 0; width: 100%; }
  main > form search input { width: 100%; }
}
</style>
</head>
<body>

<header>
  <nav>
    <a href="#" aria-current="page">Timeline</a>
    <a href="topics-mockup.html">Topics</a>
    <a href="#">Everything</a>
    <a href="#saved" id="navsaved" hidden>Saved</a>
  </nav>
</header>

<main>
  <form>
    <p aria-label="How much to show">
      <button type="button" data-level="0" aria-pressed="true">everything</button>
      <button type="button" data-level="1" aria-pressed="false">notable</button>
      <button type="button" data-level="2" aria-pressed="false">best</button>
    </p>
    <search>
      <input type="search" id="q" placeholder="Search" aria-label="Search entries">
    </search>
  </form>

  <div id="mount"></div>
</main>

<footer>
  <kbd>j</kbd>/<kbd>k</kbd> select &middot; <kbd>Enter</kbd> open
  &middot; <kbd>b</kbd> save for later &middot; <kbd>/</kbd> search
  &middot; <kbd>Esc</kbd> clear &middot; ★ my favorites
  &middot; bookmarks stay in this browser
</footer>

<script>
(() => {
  /* Finder tag colors travel with the tags (read from the xattr). */
  const TAG = {
    design:   'var(--tag-purple)',
    photo:    'var(--tag-yellow)',
    dev:      'var(--tag-blue)',
    meme:     'var(--tag-orange)',
    writing:  'var(--tag-green)',
    personal: 'var(--tag-red)',
    meta:     'var(--tag-gray)',
    apps:     'var(--tag-blue)',
    audio:    'var(--tag-orange)',
    intro:    'var(--tag-gray)',
  };

  /* fav = my `favorite` Finder tag; art = placeholder imagery (real
     thumbnails on the site); q = pairwise grade -> tier -> prominence */
  const E = [
    { label:'hello-world', ext:'.md', date:'2026-03-03', q:.82, tags:['intro'],
      sub:'This is the first post on esko.bar — what it is, why it exists, and how a folder became a website.' },
    { label:'sunset', ext:'.jpg', date:'2026-03-03', q:.55, tags:['photo'],
      sub:'Golden hour over the bay.',
      art:'linear-gradient(160deg,#f6b26b,#e06666 55%,#674ea7)' },
    { label:null, ext:'.txt', date:'2026-03-04', q:.20, tags:[],
      sub:'Just a plain text note.' },
    { label:'code-highlighting', ext:'.md', date:'2026-03-05', q:.70, tags:['dev'],
      sub:'Fenced code blocks in Rust, Python, Bash, JS — one palette in light and dark.' },
    { label:'cat-loaf', ext:'.gif', date:'2026-03-09', q:.62, tags:['meme'],
      sub:'When the deploy finally goes green.',
      art:'linear-gradient(140deg,#b7b7b7,#8d7350 70%,#5b4a36)' },
    { label:'glass-tuner', ext:'.html', date:'2026-03-11', q:.90, fav:true, tags:['design','dev'],
      sub:'An interactive SVG specular-light tuner — drag the highlight around and watch the glass respond.' },
    { label:'rain-canvas', ext:'.html', date:'2026-03-14', q:.76, tags:['design'],
      sub:'Lightweight Canvas 2D rain renderer.' },
    { label:'things-3', ext:'.link', date:'2026-03-19', q:.35, tags:['apps'],
      sub:'apps.apple.com · App Store' },
    { label:'the-daily', ext:'.link', date:'2026-03-19', q:.40, tags:['audio'],
      sub:'podcasts.apple.com · Podcast' },
    { label:'snow-test', ext:'.html', date:'2026-04-02', q:.68, tags:['design'],
      sub:'Snowfall variant prototypes.' },
    { label:'screenshot-bug', ext:'.png', date:'2026-04-18', q:.38, tags:['dev','meme'],
      sub:'It works on my machine.' },
    { label:'on-file-systems', ext:'.md', date:'2026-04-24', q:.88, fav:true, tags:['writing'],
      sub:'Why folders lost to tags: a file lives in one place, a thought never does.' },
    { label:'journal-2026-05', ext:'.md', date:'2026-05-02', q:.30, tags:['personal'],
      sub:'A personal post — tagged personal, still public.' },
    { label:'open-source-licenses', ext:'/', date:'2026-05-18', q:.72, tags:['meta'],
      sub:'A folder as an entry — clean name, native date, assets addressable inside.' },
    { label:'wireframe', ext:'.png', date:'2026-05-26', q:.45, tags:['design'],
      sub:'420 KB · 1600×1000' },
    { label:'family-trip', ext:'.jpg', date:'2026-05-30', q:.84, tags:['photo'],
      sub:'Twelve photos from the coast — fog in the morning, unreasonable blue by noon.',
      art:'linear-gradient(150deg,#76a5af,#45818e 45%,#134f5c 80%,#0b5394)' },
  ];

  const MONTHS = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];
  const BOOKMARK = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M6.5 3.5h11V21l-5.5-4-5.5 4z"/></svg>';

  const store = window.localStorage;
  const saved = new Set(JSON.parse(store.getItem('mock-saved') || '[]'));
  const keyOf = e => e.label ?? e.date + e.ext;
  const tier = q => q >= .78 ? 3 : q >= .5 ? 2 : 1;

  let level = 0, query = '', view = 'all', selected = -1;

  const mount = document.getElementById('mount');
  const navsaved = document.getElementById('navsaved');
  const qInput = document.getElementById('q');

  const esc = s => s.replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const matches = e => {
    if (view === 'saved' && !saved.has(keyOf(e))) return false;
    if (tier(e.q) < level + 1) return false;
    if (!query) return true;
    return [e.label ?? '', e.sub, ...e.tags].join(' ').toLowerCase().includes(query);
  };

  const monthKey = e => {
    const [y, m] = e.date.split('-');
    return MONTHS[+m - 1] + ' ' + y;
  };
  const shortDate = e => {
    const [, m, d] = e.date.split('-');
    return MONTHS[+m - 1].slice(0, 3) + ' ' + (+d);
  };

  const row = (e, i) => `
    <li>
      <article data-i="${i}" data-tier="${tier(e.q)}"${
        i === selected ? ' class="selected"' : ''}>
        <aside>
          <time datetime="${e.date}">${shortDate(e)}</time>
          ${e.fav ? '<b title="A favorite of mine">★</b>' : ''}
          <button type="button" aria-pressed="${saved.has(keyOf(e))}"
            aria-label="Save for later (stays in this browser)"
            title="Save for later — stays in this browser">${BOOKMARK}</button>
        </aside>
        <div>
          <h3><a href="#/${e.label ?? 'untitled'}"${
            tier(e.q) === 1 ? ` title="${esc(e.sub)}"` : ''}>${e.label
              ? esc(e.label) + '<small>' + esc(e.ext) + '</small>'
              : '<i>(untitled)</i><small>' + esc(e.ext) + '</small>'}</a></h3>
          <p>${esc(e.sub)}</p>
          ${e.art ? `<figure style="background:${e.art}" role="img" aria-label="Preview of ${esc(e.label ?? 'image')}"></figure>` : ''}
          <footer>${e.tags.map(t =>
            `<a href="#/+${t}" style="--tag:${TAG[t] ?? 'var(--tag-gray)'}">${esc(t)}</a>`).join('')}
          </footer>
        </div>
      </article>
    </li>`;

  function paint() {
    const data = E.map((e, i) => [e, i]).filter(([e]) => matches(e))
      .sort(([a], [b]) => a.date < b.date ? 1 : -1);
    if (!data.length) {
      mount.innerHTML = `<p>${view === 'saved'
        ? 'Nothing saved yet — the bookmark on any entry keeps it here, in this browser.'
        : 'Nothing matches.'}</p>`;
    } else {
      const groups = [];
      data.forEach(([e, i]) => {
        const k = monthKey(e);
        if (!groups.length || groups.at(-1)[0] !== k) groups.push([k, []]);
        groups.at(-1)[1].push([e, i]);
      });
      mount.innerHTML = groups.map(([m, items]) =>
        `<section><h2>${m}</h2><ul>${
          items.map(([e, i]) => row(e, i)).join('')}</ul></section>`).join('');
    }
    navsaved.hidden = saved.size === 0 && view !== 'saved';
    navsaved.setAttribute('aria-current', view === 'saved' ? 'page' : 'false');
    document.querySelector('nav a[href="#"]')
      .setAttribute('aria-current', view === 'all' ? 'page' : 'false');
  }

  /* ---------- controls ---------- */

  document.querySelectorAll('[data-level]').forEach(b =>
    b.addEventListener('click', () => {
      level = +b.dataset.level;
      document.querySelectorAll('[data-level]').forEach(x =>
        x.setAttribute('aria-pressed', x === b));
      selected = -1;
      paint();
    }));

  qInput.addEventListener('input', () => {
    query = qInput.value.trim().toLowerCase();
    selected = -1;
    paint();
  });

  navsaved.addEventListener('click', ev => {
    ev.preventDefault();
    view = view === 'saved' ? 'all' : 'saved';
    selected = -1;
    paint();
  });
  document.querySelector('nav a[href="#"]').addEventListener('click', ev => {
    ev.preventDefault();
    view = 'all';
    selected = -1;
    paint();
  });

  /* ---------- bookmarks (localStorage only — nothing leaves the browser) */

  mount.addEventListener('click', ev => {
    const btn = ev.target.closest('aside > button');
    if (!btn) return;
    const e = E[+btn.closest('article').dataset.i];
    saved.has(keyOf(e)) ? saved.delete(keyOf(e)) : saved.add(keyOf(e));
    store.setItem('mock-saved', JSON.stringify([...saved]));
    paint();
  });

  /* ---------- keyboard ---------- */

  const rows = () => [...mount.querySelectorAll('article')];

  function move(delta) {
    const r = rows();
    if (!r.length) return;
    const cur = r.findIndex(a => +a.dataset.i === selected);
    const next = Math.max(0, Math.min(r.length - 1, cur + delta));
    selected = +r[next].dataset.i;
    r.forEach(a => a.classList.toggle('selected', +a.dataset.i === selected));
    r[next].scrollIntoView({ block: 'nearest' });
  }

  document.addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.target === qInput) {
      if (ev.key === 'Escape') { qInput.value = ''; query = ''; qInput.blur(); paint(); }
      return;
    }
    if (ev.target.closest('input, textarea')) return;
    switch (ev.key) {
      case 'j': case 'ArrowDown': ev.preventDefault(); move(1); break;
      case 'k': case 'ArrowUp': ev.preventDefault(); move(-1); break;
      case 'Enter': {
        const a = mount.querySelector('article.selected h3 a');
        if (a) a.click();
        break;
      }
      case 'b': {
        const btn = mount.querySelector('article.selected aside > button');
        if (btn) btn.click();
        break;
      }
      case '/': ev.preventDefault(); qInput.focus(); break;
      case 'Escape':
        selected = -1;
        if (query) { qInput.value = ''; query = ''; }
        paint();
        break;
    }
  });

  paint();
})();
</script>
</body>
</html>
